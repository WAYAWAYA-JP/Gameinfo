name: Update Game Deals

on:
  schedule:
    # 毎日朝9時（日本時間）= UTC 0時
    - cron: '0 0 * * *'
    # 毎日夜9時（日本時間）= UTC 12時
    - cron: '0 12 * * *'
  workflow_dispatch:  # 手動実行

permissions:
  contents: write

concurrency:
  group: update-games
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run update script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python scripts/update-deals.py

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet games-data.json 2>/dev/null; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes to commit"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected"
          fi

      - name: Commit and push
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

          git add games-data.json

          git commit -m "🎮 自動更新: ゲーム情報を更新 ($(date +'%Y-%m-%d %H:%M'))"

          # リトライロジック（最大5回）
          for i in {1..5}; do
            if git push; then
              echo "✅ Push successful"
              exit 0
            fi
            echo "⚠️ Push failed, retrying in 5s... (attempt $i/5)"
            sleep 5

            # リモートの変更を取得
            git fetch origin ${{ github.ref_name }}

            # コンフリクト回避: リモートをマージしてローカルの変更を優先
            git reset --soft origin/${{ github.ref_name }}
            git checkout --theirs games-data.json 2>/dev/null || true

            # 再度スクリプトを実行して最新データを生成
            python scripts/update-deals.py

            git add games-data.json
            git commit -m "🎮 自動更新: ゲーム情報を更新 ($(date +'%Y-%m-%d %H:%M'))" || true
          done

          echo "❌ Push failed after 5 attempts"
          exit 1
