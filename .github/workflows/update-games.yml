name: Update Game Deals

on:
  schedule:
    # スケジュール実行の信頼性向上のため、1日4回に変更
    # GitHubのcronは遅延・スキップされることがあるため冗長化
    # 毎日朝6時（日本時間）= UTC 21:00 (前日)
    - cron: '0 21 * * *'
    # 毎日朝9時（日本時間）= UTC 0:00
    - cron: '0 0 * * *'
    # 毎日夜6時（日本時間）= UTC 9:00
    - cron: '0 9 * * *'
    # 毎日夜9時（日本時間）= UTC 12:00
    - cron: '0 12 * * *'
  workflow_dispatch:  # 手動実行
  repository_dispatch:  # 外部からのトリガー用
    types: [update-games]

permissions:
  contents: write

concurrency:
  group: update-games
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # ジョブが長時間ハングするのを防止

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run update script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python scripts/update-deals.py

      - name: Check for changes
        id: check_changes
        run: |
          if [ ! -f games-data.json ]; then
            echo "❌ Error: games-data.json not found"
            exit 1
          fi
          if git diff --quiet games-data.json; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No changes to commit"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "✅ Changes detected"
          fi

      - name: Commit and push
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

          git add games-data.json

          git commit -m "🎮 自動更新: ゲーム情報を更新 ($(date +'%Y-%m-%d %H:%M'))"

          # リトライロジック（最大5回）
          for i in {1..5}; do
            if git push; then
              echo "✅ Push successful"
              exit 0
            fi
            echo "⚠️ Push failed, retrying in 5s... (attempt $i/5)"
            sleep 5

            # リモートの変更を取得
            git fetch origin ${{ github.ref_name }}

            # リモートの状態にリセットして、スクリプトを再実行
            git reset --hard origin/${{ github.ref_name }}

            echo "🔄 Re-running update script..."
            python scripts/update-deals.py

            # 変更があれば再コミット
            if ! git diff --quiet games-data.json; then
              git add games-data.json
              git commit -m "🎮 自動更新: ゲーム情報を更新 ($(date +'%Y-%m-%d %H:%M'))"
            else
              echo "ℹ️ No changes after re-running script"
              exit 0
            fi
          done

          echo "❌ Push failed after 5 attempts"
          exit 1
